<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성경 암송 자료</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: #1a1a1a;
            overflow: hidden;
            height: 100vh;
        }
        
        .presentation-container {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .slide {
            display: none;
            width: 90vw;
            max-width: 1200px;
            height: 80vh;
            border-radius: 20px;
            padding: 60px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .slide.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .slide-number {
            position: absolute;
            top: 30px;
            left: 40px;
            font-size: 28px;
            font-weight: bold;
            opacity: 0.5;
        }
        
        .reference {
            font-size: 54px;
            font-weight: bold;
            margin-bottom: 50px;
            text-align: center;
            color: #ffffff;
        }
        
        .verse-container {
            text-align: center;
            max-width: 900px;
        }
        
        .verse-line {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            margin: 8px 0;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        
        .verse-line.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 힌트 슬라이드의 첫 글자 스타일 */
        .hint-line {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            margin: 8px 0;
            line-height: 1.4;
        }
        
        .hint-line.show {
            opacity: 0.8;
            transform: translateY(0);
        }
        
        /* 암기 문장 스타일 */
        .mnemonic-sentence {
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.6s ease;
        }
        
        .mnemonic-sentence.show {
            opacity: 1;
            transform: scale(1);
        }
        
        /* 배경 색상 그룹 */
        .bg-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .bg-2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .bg-3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .bg-4 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .bg-5 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        
        /* 타이틀 슬라이드 */
        .title-slide {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        .title-slide h1 {
            font-size: 72px;
            margin-bottom: 30px;
            color: #ffffff;
        }
        
        .title-slide p {
            font-size: 36px;
            color: rgba(255,255,255,0.8);
        }
        
        /* 네비게이션 */
        .nav-buttons {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 1000;
        }
        
        .nav-button {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        
        .nav-button:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        
        .nav-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: rgba(255,255,255,0.8);
            transition: width 0.3s;
            z-index: 1000;
        }
        
        .slide-counter {
            position: fixed;
            top: 20px;
            right: 40px;
            color: rgba(255,255,255,0.7);
            font-size: 18px;
            z-index: 1000;
        }
        
        .instruction {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            text-align: center;
            z-index: 1000;
        }
    
        /* 관리자 UI 스타일 */
        .management-ui {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f4f6f8;
            z-index: 2000;
            overflow-y: auto;
            color: #333;
            font-family: 'Noto Sans KR', sans-serif;
            padding: 20px;
        }
        .management-ui.active {
            display: block;
        }
        .mgmt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .mgmt-header h2 { margin: 0; color: #2c3e50; }
        .btn {
            padding: 8px 16px; border: none; border-radius: 5px;
            cursor: pointer; font-weight: bold; font-size: 14px;
            transition: all 0.2s;
        }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: #95a5a6; color: white; }
        .btn-secondary:hover { background: #7f8c8d; }
        .btn-purple { background: #8e44ad; color: white; }
        .btn-purple:hover { background: #6c3483; }
        
        .verse-table-container {
            background: white; border-radius: 10px; padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; font-weight: bold; }
        tr:hover { background: #f1f2f6; }
        tr:has(.row-chk:checked) { background: #fef9e7; }
        
        /* 모달 스타일 */
        .modal-overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 3000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: white; padding: 25px; border-radius: 10px;
            width: 500px; max-width: 90%; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;
            font-family: inherit; font-size: 14px;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        
        .top-right-btns {
            position: fixed; top: 20px; left: 20px; z-index: 1001;
            display: flex; gap: 10px;
        }

    </style>
</head>
<body>
    
    <div class="top-right-btns">
        <button class="nav-button" onclick="toggleManagementUI()" style="padding: 8px 16px; font-size:14px;">⚙️ 관리자 모드</button>
    </div>

    
    <!-- 관리자 UI -->
    <div class="management-ui" id="managementUI">
        <div class="mgmt-header">
            <h2>성경 암송 자료 관리</h2>
            <div style="display:flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn btn-secondary" onclick="exportDataWithPicker()">JSON 백업</button>
                <input type="file" id="importFile" style="display:none;" accept=".json" onchange="processImportEvent(event)">
                <button class="btn btn-secondary" onclick="importDataWithPicker()">JSON 복원</button>
                <button class="btn btn-primary" onclick="openModal('add')">+ 새 구절 추가</button>
                <button class="btn btn-secondary" onclick="toggleManagementUI()">닫기 ✖</button>
            </div>
        </div>
        
        <div class="verse-table-container">
            <div style="margin-bottom: 15px; display:flex; gap: 10px; align-items:center; flex-wrap: wrap; background: #f8f9fa; padding: 10px; border-radius: 8px;">
                <label style="font-weight:bold;">현재 자료 선택:</label>
                <select id="datasetSelector" onchange="changeDataset(this.value)" style="padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc; font-weight:bold; min-width:150px;">
                </select>
                <button class="btn btn-primary" style="padding: 4px 10px; font-size:12px;" onclick="createNewDataset()">새 자료 만들기</button>
                <button class="btn btn-secondary" style="padding: 4px 10px; font-size:12px;" onclick="renameCurrentDataset()">현재 이름 변경</button>
                <button class="btn btn-danger" style="padding: 4px 10px; font-size:12px;" onclick="deleteCurrentDataset()">현재 자료 삭제</button>
                <button class="btn btn-primary" style="padding: 4px 10px; font-size:12px; background:#8e44ad;" onclick="saveAsDataset()">📋 다른 이름으로 저장</button>
            </div>
            <!-- 다중 선택 삭제 툴바 -->
            <div id="bulkDeleteBar" style="display:none; align-items:center; gap:12px; background:#fff3cd; border:1px solid #ffc107; border-radius:8px; padding:10px 16px; margin-bottom:12px;">
                <span id="selectedCountLabel" style="font-weight:bold; color:#856404;">0개 선택됨</span>
                <button class="btn btn-danger" onclick="deleteSelectedVerses()" style="padding:5px 14px;">🗑️ 선택 삭제</button>
                <button class="btn btn-secondary" onclick="clearSelection()" style="padding:5px 14px;">선택 해제</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th style="width: 36px; text-align:center;">
                            <input type="checkbox" id="selectAllChk" title="전체 선택" onchange="toggleSelectAll(this.checked)" style="width:16px;height:16px;cursor:pointer;">
                        </th>
                        <th style="width: 44px;">순번</th>
                        <th style="width: 100px;">장절</th>
                        <th>구절</th>
                        <th>암기 힌트</th>
                        <th style="width: 50px;">아이콘</th>
                        <th style="width: 120px;">관리</th>
                    </tr>
                </thead>
                <tbody id="verseTableBody">
                    <!-- JS로 채워짐 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 추가/수정 모달 -->
    <div class="modal-overlay" id="verseModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-top:0; margin-bottom: 20px; color:#2c3e50;">구절 추가</h3>
            <input type="hidden" id="editId">
            <div class="form-group">
                <label>장절 (예: 창 1:1)</label>
                <input type="text" id="inputRef" placeholder="성경 장절 입력">
            </div>
            <div class="form-group">
                <label>구절 내용 (엔터로 줄바꿈 구분)</label>
                <textarea id="inputLines" rows="4" placeholder="구절을 입력하세요. 줄바꿈을 하면 화면에서도 줄바꿈이 됩니다." onblur="autoGenerateMnemonic()"></textarea>
            </div>
            <div class="form-group">
                <label>암기 힌트 문장 (자동생성됨, 자유롭게 띄어쓰기 등 수정 가능)</label>
                <input type="text" id="inputMnemonic" placeholder="예: 태초에 하나님이 천지를 창조하시니라 -> '태하천창' 으로 기억하세요!">
            </div>
            <div class="form-group">
                <label>아이콘 (이모지) <span style="font-weight:normal; font-size:12px; color:#666;">(Windows: 'Win + .' 키 입력)</span></label>
                <div style="display:flex; gap: 5px; margin-bottom: 5px;">
                    <button class="btn btn-secondary" style="padding:2px 5px; font-size:12px;" onclick="document.getElementById('inputIcon').value += '🙏'">🙏</button>
                    <button class="btn btn-secondary" style="padding:2px 5px; font-size:12px;" onclick="document.getElementById('inputIcon').value += '❤️'">❤️</button>
                    <button class="btn btn-secondary" style="padding:2px 5px; font-size:12px;" onclick="document.getElementById('inputIcon').value += '✨'">✨</button>
                    <button class="btn btn-secondary" style="padding:2px 5px; font-size:12px;" onclick="document.getElementById('inputIcon').value += '📖'">📖</button>
                    <button class="btn btn-secondary" style="padding:2px 5px; font-size:12px;" onclick="document.getElementById('inputIcon').value += '👑'">👑</button>
                    <button class="btn btn-secondary" style="padding:2px 5px; font-size:12px;" onclick="document.getElementById('inputIcon').value += '🕊️'">🕊️</button>
                    <button class="btn btn-secondary" style="padding:2px 5px; font-size:12px;" onclick="document.getElementById('inputIcon').value += '🌍'">🌍</button>
                </div>
                <input type="text" id="inputIcon" placeholder="예: 🌍✨">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">취소</button>
                <button class="btn btn-primary" onclick="saveVerse()">저장</button>
            </div>
        </div>
    </div>

    <div class="progress-bar" id="progressBar"></div>
    <div class="slide-counter" id="slideCounter">1 / 147</div>
    
    <div class="presentation-container" id="presentation">
        <!-- 타이틀 슬라이드 -->
        <div class="slide active title-slide">
            <h1>성경 암송 자료</h1>
            <p id="titleSubtitle">핵심 성경 구절</p>
        </div>
        
        <!-- 슬라이드들이 JavaScript로 동적 생성됨 -->
    </div>
    
    <div class="instruction">
        클릭/스페이스바: 다음 줄 | 화살표 키: 슬라이드 이동 | 힌트 슬라이드 → 전체 본문 슬라이드
    </div>
    
    <div class="nav-buttons">
        <button class="nav-button" id="prevBtn" onclick="prevSlide()">◀ 이전</button>
        <button class="nav-button" id="nextBtn" onclick="nextSlide()">다음 ▶</button>
    </div>

    <script>

            {num: 2, ref: "계 22:21", lines: ["주 예수의 은혜가", "모든 자들에게 있을지어다", "아멘"], icon: "🙏💫"},
            {num: 3, ref: "창 3:15", lines: ["내가 너로 여자와 원수가 되게 하고", "네 후손도 여자의 후손과 원수가 되게 하리니", "여자의 후손은 네 머리를 상하게 할 것이요", "너는 그의 발꿈치를 상하게 할 것이니라 하시고"], icon: "🐍⚔️"},

            {num: 15, ref: "마 16:16", lines: ["시몬 베드로가 대답하여 이르되", "주는 그리스도시요", "살아 계신 하나님의 아들이시니이다"], icon: "👑✝️"},
            {num: 16, ref: "행 1:8", lines: ["오직 성령이 너희에게 임하시면", "너희가 권능을 받고", "예루살렘과 온 유대와 사마리아와", "땅끝까지 이르러", "내 증인이 되리라 하시니라"], icon: "🕊️🌍"},
            {num: 17, ref: "행 16:31", lines: ["이르되 주 예수를 믿으라", "그리하면 너와 네 집이", "구원을 받으리라 하고"], icon: "🏠💫"},

        // 첫 글자로 암기 문장 만들기
        function createMnemonic(lines) {
            // 각 줄의 첫 글자 추출
            const firstChars = lines
                .map(line => line.trim())
                .filter(line => line.length > 0)
                .map(line => line.charAt(0));
            
            // 첫 글자들을 합치기
            const mnemonic = firstChars.join('');
            
            // 3글자마다 공백 추가해서 읽기 쉽게
            let formatted = '';
            for (let i = 0; i < mnemonic.length; i++) {
                formatted += mnemonic[i];
                if ((i + 1) % 3 === 0 && i < mnemonic.length - 1) {
                    formatted += ' ';
                }
            }
            
            return `"${formatted}" 으로 기억하세요!`;
        }

        
        let bibleDatasets = { "기본 자료": [] };
        let currentDatasetName = "기본 자료";
        let appData = []; // reference to bibleDatasets[currentDatasetName]
        const STORAGE_KEY = 'bible_memory_verses_data';

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed)) {
                        bibleDatasets = { "기본 자료": parsed };
                    } else {
                        bibleDatasets = parsed;
                    }
                } catch (e) {
                    console.error('Data parse error', e);
                    initDefaultData();
                }
            } else {
                initDefaultData();
            }
            
            if(Object.keys(bibleDatasets).length === 0) {
                initDefaultData();
            }
            
            const lastActive = localStorage.getItem('bible_memory_active_dataset');
            if(lastActive && bibleDatasets[lastActive]) {
                currentDatasetName = lastActive;
            } else {
                currentDatasetName = Object.keys(bibleDatasets)[0];
            }
            
            appData = bibleDatasets[currentDatasetName];
            
            let modified = false;
            Object.values(bibleDatasets).forEach(dataset => {
                dataset.forEach((v, index) => {
                    if (v.lines) {
                        let newLines = [];
                        let changed = false;
                        v.lines.forEach(line => {
                            if (typeof line === 'string' && line.includes('\\n')) {
                                newLines.push(...line.split('\\n'));
                                changed = true;
                            } else {
                                newLines.push(line);
                            }
                        });
                        if (changed) {
                            v.lines = newLines;
                            modified = true;
                        }
                    }
                    if (!v.id) { v.id = Date.now() + Math.random(); modified = true; }
                    if (!v.mnemonic && v.lines) { 
                        v.mnemonic = createMnemonic(v.lines); 
                        modified = true; 
                    }
                });
            });
            if(modified) saveData();
            
            createSlides();
            showSlide(0);
        }

        function initDefaultData() {
            const defaultData = JSON.parse(JSON.stringify(defaultVerses));
            defaultData.forEach((v, i) => {
                v.id = Date.now() + i;
                v.mnemonic = createMnemonic(v.lines);
            });
            bibleDatasets = { "기본 자료": defaultData };
            currentDatasetName = "기본 자료";
            appData = bibleDatasets[currentDatasetName];
            saveData();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(bibleDatasets));
            localStorage.setItem('bible_memory_active_dataset', currentDatasetName);
        }

        function toggleManagementUI() {
            const ui = document.getElementById('managementUI');
            if (ui.classList.contains('active')) {
                ui.classList.remove('active');
                createSlides();
                showSlide(0);
            } else {
                ui.classList.add('active');
                updateDatasetSelector();
                renderTable();
            }
        }

        function updateDatasetSelector() {
            const select = document.getElementById('datasetSelector');
            select.innerHTML = '';
            Object.keys(bibleDatasets).forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                if(name === currentDatasetName) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function changeDataset(name) {
            if(bibleDatasets[name]) {
                currentDatasetName = name;
                appData = bibleDatasets[name];
                saveData();
                renderTable();
            }
        }

        function createNewDataset() {
            const name = prompt('새로운 자료(덱)의 이름을 입력하세요:', '새로운 자료');
            if(name && name.trim() !== '') {
                if(bibleDatasets[name]) {
                    alert('이미 존재하는 이름입니다.');
                    return;
                }
                bibleDatasets[name] = [];
                currentDatasetName = name;
                appData = bibleDatasets[name];
                saveData();
                updateDatasetSelector();
                renderTable();
            }
        }

        function renameCurrentDataset() {
            const newName = prompt('현재 자료의 새 이름을 입력하세요:', currentDatasetName);
            if(newName && newName.trim() !== '' && newName !== currentDatasetName) {
                if(bibleDatasets[newName]) {
                    alert('이미 존재하는 이름입니다.');
                    return;
                }
                bibleDatasets[newName] = bibleDatasets[currentDatasetName];
                delete bibleDatasets[currentDatasetName];
                currentDatasetName = newName;
                appData = bibleDatasets[newName];
                saveData();
                updateDatasetSelector();
            }
        }

        function deleteCurrentDataset() {
            if(Object.keys(bibleDatasets).length <= 1) {
                alert('최소 1개의 자료 세트는 남아있어야 합니다.');
                return;
            }
            if(confirm(`정말 '${currentDatasetName}' 자료를 삭제하시겠습니까?`)) {
                delete bibleDatasets[currentDatasetName];
                currentDatasetName = Object.keys(bibleDatasets)[0];
                appData = bibleDatasets[currentDatasetName];
                saveData();
                updateDatasetSelector();
                renderTable();
            }
        }

        function saveAsDataset() {
            const defaultName = currentDatasetName + ' (사본)';
            const newName = prompt(`현재 자료 "${currentDatasetName}"를 다른 이름으로 저장합니다.\n새 이름을 입력하세요:`, defaultName);
            if (!newName || newName.trim() === '') return;
            const trimmed = newName.trim();
            if (bibleDatasets[trimmed]) {
                if (!confirm(`"${trimmed}" 이름의 자료가 이미 존재합니다. 덮어쓰시겠습니까?`)) return;
            }
            // 깊은 복사
            bibleDatasets[trimmed] = JSON.parse(JSON.stringify(appData));
            currentDatasetName = trimmed;
            appData = bibleDatasets[trimmed];
            saveData();
            updateDatasetSelector();
            renderTable();
            alert(`✅ "${trimmed}" 이름으로 저장되었습니다.`);
        }

        function renderTable() {
            const tbody = document.getElementById('verseTableBody');
            tbody.innerHTML = '';
            
            appData.forEach((v, index) => {
                const tr = document.createElement('tr');
                tr.dataset.id = v.id;
                tr.innerHTML = `
                    <td style="text-align:center;">
                        <input type="checkbox" class="row-chk" data-id="${v.id}" onchange="onRowCheckChange()" style="width:16px;height:16px;cursor:pointer;">
                    </td>
                    <td>${index + 1}</td>
                    <td><b>${v.ref}</b></td>
                    <td style="white-space:pre-wrap; font-size:13px;">${v.lines.join('\n')}</td>
                    <td style="font-size:12px; color:#555;">${v.mnemonic || ''}</td>
                    <td>${v.icon || ''}</td>
                    <td>
                        <button class="btn btn-secondary" style="padding:4px 8px; font-size:12px;" onclick="openModal('edit', ${v.id})">수정</button>
                        <button class="btn btn-danger" style="padding:4px 8px; font-size:12px;" onclick="deleteVerse(${v.id})">삭제</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // 테이블 새로 그릴 때 전체선택 체크박스·툴바 초기화
            document.getElementById('selectAllChk').checked = false;
            document.getElementById('bulkDeleteBar').style.display = 'none';
        }

        function onRowCheckChange() {
            const all = document.querySelectorAll('.row-chk');
            const checked = document.querySelectorAll('.row-chk:checked');
            document.getElementById('selectAllChk').checked = all.length > 0 && checked.length === all.length;
            document.getElementById('selectAllChk').indeterminate = checked.length > 0 && checked.length < all.length;
            const bar = document.getElementById('bulkDeleteBar');
            if (checked.length > 0) {
                bar.style.display = 'flex';
                document.getElementById('selectedCountLabel').textContent = `${checked.length}개 선택됨`;
            } else {
                bar.style.display = 'none';
            }
        }

        function toggleSelectAll(checked) {
            document.querySelectorAll('.row-chk').forEach(chk => chk.checked = checked);
            onRowCheckChange();
        }

        function clearSelection() {
            document.querySelectorAll('.row-chk').forEach(chk => chk.checked = false);
            document.getElementById('selectAllChk').checked = false;
            document.getElementById('selectAllChk').indeterminate = false;
            document.getElementById('bulkDeleteBar').style.display = 'none';
        }

        function deleteSelectedVerses() {
            const checked = document.querySelectorAll('.row-chk:checked');
            if (checked.length === 0) return;
            if (!confirm(`선택한 ${checked.length}개 구절을 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.`)) return;
            const ids = new Set([...checked].map(chk => Number(chk.dataset.id)));
            appData = appData.filter(v => !ids.has(Number(v.id)));
            bibleDatasets[currentDatasetName] = appData;
            saveData();
            renderTable();
        }

        function autoGenerateMnemonic() {
            const linesStr = document.getElementById('inputLines').value.trim();
            const inputMnemonic = document.getElementById('inputMnemonic');
            if(linesStr && inputMnemonic.value.trim() === '') {
                const lines = linesStr.split('\n').map(l => l.trimEnd()).filter(l => l.trim() !== '');
                inputMnemonic.value = createMnemonic(lines);
            }
        }

        function openModal(mode, id = null) {
            const modal = document.getElementById('verseModal');
            document.getElementById('modalTitle').textContent = mode === 'add' ? '새 구절 추가' : '구절 수정';
            
            if (mode === 'edit') {
                const verse = appData.find(v => v.id === id);
                if(verse) {
                    document.getElementById('editId').value = verse.id;
                    document.getElementById('inputRef').value = verse.ref;
                    document.getElementById('inputLines').value = verse.lines.join('\n');
                    document.getElementById('inputMnemonic').value = verse.mnemonic || '';
                    document.getElementById('inputIcon').value = verse.icon || '';
                }
            } else {
                document.getElementById('editId').value = '';
                document.getElementById('inputRef').value = '';
                document.getElementById('inputLines').value = '';
                document.getElementById('inputMnemonic').value = '';
                document.getElementById('inputIcon').value = '✨';
            }
            
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('verseModal').classList.remove('active');
        }

        function saveVerse() {
            const id = document.getElementById('editId').value;
            const ref = document.getElementById('inputRef').value.trim();
            const linesStr = document.getElementById('inputLines').value.replace(/\s+$/, '');
            const mnemonic = document.getElementById('inputMnemonic').value.trim();
            const icon = document.getElementById('inputIcon').value.trim();
            
            if(!ref || !linesStr) {
                alert('장절과 구절 내용을 입력해주세요.');
                return;
            }
            
            const lines = linesStr.split('\n').map(l => l.trimEnd());
            const finalMnemonic = mnemonic || createMnemonic(lines);
            
            if (id) {
                const idx = appData.findIndex(v => v.id == id);
                if(idx !== -1) {
                    appData[idx] = { ...appData[idx], ref, lines, mnemonic: finalMnemonic, icon };
                }
            } else {
                const newId = Date.now();
                appData.push({ id: newId, num: appData.length + 1, ref, lines, mnemonic: finalMnemonic, icon });
            }
            
            saveData();
            closeModal();
            renderTable();
        }

        function deleteVerse(id) {
            if(confirm('정말 이 구절을 삭제하시겠습니까?')) {
                appData = appData.filter(v => v.id !== id);
                bibleDatasets[currentDatasetName] = appData;
                saveData();
                renderTable();
            }
        }

        async function exportDataWithPicker() {
            const dataStr = JSON.stringify(bibleDatasets, null, 2);
            try {
                if (window.showSaveFilePicker) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'bible_datasets_backup.json',
                        types: [{ description: 'JSON 파일', accept: {'application/json': ['.json']} }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(dataStr);
                    await writable.close();
                    alert('성공적으로 백업되었습니다.');
                } else {
                    throw new Error('Not supported');
                }
            } catch (err) {
                // Fallback (cancel or not supported)
                if (err.name !== 'AbortError') {
                    alert('이 브라우저/환경에서는 폴더 지정 저장 기능이 제한되어 있어 다운로드 폴더에 자동 저장됩니다.\\n(크롬 설정에서 [다운로드 전에 각 파일의 저장 위치 확인]을 켜시면 위치를 직접 지정할 수 있습니다.)');
                    const downloadAnchorNode = document.createElement('a');
                    downloadAnchorNode.setAttribute("href", "data:text/json;charset=utf-8," + encodeURIComponent(dataStr));
                    downloadAnchorNode.setAttribute("download", "bible_datasets_backup.json");
                    document.body.appendChild(downloadAnchorNode);
                    downloadAnchorNode.click();
                    downloadAnchorNode.remove();
                }
            }
        }

        async function importDataWithPicker() {
            try {
                if (window.showOpenFilePicker) {
                    const [fileHandle] = await window.showOpenFilePicker({
                        types: [{ description: 'JSON 파일', accept: {'application/json': ['.json']} }]
                    });
                    const file = await fileHandle.getFile();
                    processFile(file);
                } else {
                    document.getElementById('importFile').click();
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    document.getElementById('importFile').click();
                }
            }
        }

        function processImportEvent(event) {
            const file = event.target.files[0];
            if (!file) return;
            processFile(file);
            event.target.value = '';
        }

        function processFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if(typeof imported === 'object' && imported !== null && !Array.isArray(imported)) {
                        bibleDatasets = imported;
                        currentDatasetName = Object.keys(bibleDatasets)[0];
                        appData = bibleDatasets[currentDatasetName];
                        saveData();
                        updateDatasetSelector();
                        renderTable();
                        alert('데이터가 성공적으로 복원되었습니다.');
                    } else if (Array.isArray(imported)) {
                        bibleDatasets = { "복원된 자료": imported };
                        currentDatasetName = "복원된 자료";
                        appData = bibleDatasets[currentDatasetName];
                        saveData();
                        updateDatasetSelector();
                        renderTable();
                        alert('배열 형식의 예전 데이터가 "복원된 자료" 이름으로 복원되었습니다.');
                    } else {
                        alert('잘못된 형식의 파일입니다.');
                    }
                } catch(err) {
                    alert('파일을 읽는 중 오류가 발생했습니다.');
                }
            };
            reader.readAsText(file);
        }

        let currentSlide = 0;
        let currentLine = 0;
        
        // 슬라이드 생성
        function createSlides() {
            const presentation = document.getElementById('presentation');
            const existingSlides = presentation.querySelectorAll('.slide:not(.title-slide)');
            existingSlides.forEach(s => s.remove());
            
            const subtitle = document.getElementById('titleSubtitle');
            if(subtitle) subtitle.textContent = `${currentDatasetName} (${appData.length}구절)`;

            
            appData.forEach((verse, index) => {
                const bgClass = `bg-${(Math.floor(index / 9) % 5) + 1}`;
                
                // 가장 긴 줄 찾기
                const maxLineLength = Math.max(...verse.lines.map(line => line.length));
                let fontSize;
                
                if (maxLineLength < 15) fontSize = '48px';
                else if (maxLineLength < 20) fontSize = '44px';
                else if (maxLineLength < 25) fontSize = '38px';
                else if (maxLineLength < 30) fontSize = '34px';
                else if (maxLineLength < 35) fontSize = '30px';
                else if (maxLineLength < 40) fontSize = '28px';
                else if (maxLineLength < 45) fontSize = '26px';
                else if (maxLineLength < 50) fontSize = '24px';
                else if (maxLineLength < 55) fontSize = '22px';
                else fontSize = '20px';
                
                // 줄이 많으면 폰트 크기 조정
                if (verse.lines.length > 8) {
                    fontSize = parseInt(fontSize) * 0.85 + 'px';
                } else if (verse.lines.length > 6) {
                    fontSize = parseInt(fontSize) * 0.9 + 'px';
                }
                
                // ===== 첫 번째 슬라이드: 첫 글자 힌트 =====
                const hintSlide = document.createElement('div');
                hintSlide.className = `slide ${bgClass}`;
                hintSlide.dataset.slideType = 'hint';
                
                // 슬라이드 번호
                const slideNum1 = document.createElement('div');
                slideNum1.className = 'slide-number';
                slideNum1.textContent = `#${verse.num} 힌트 (${verse.lines.length}줄)`;
                slideNum1.style.color = 'rgba(255,255,255,0.7)';
                hintSlide.appendChild(slideNum1);
                
                // 아이콘 일러스트 (성경 참조 위에 크게 표시)
                const iconDiv = document.createElement('div');
                iconDiv.style.fontSize = '120px';
                iconDiv.style.marginBottom = '20px';
                iconDiv.style.textAlign = 'center';
                iconDiv.style.filter = 'drop-shadow(0 4px 8px rgba(0,0,0,0.3))';
                iconDiv.textContent = verse.icon;
                hintSlide.appendChild(iconDiv);
                
                // 성경 참조
                const ref1 = document.createElement('div');
                ref1.className = 'reference';
                ref1.textContent = verse.ref;
                hintSlide.appendChild(ref1);
                
                // 힌트 컨테이너
                const hintContainer = document.createElement('div');
                hintContainer.className = 'verse-container';
                
                // 각 줄의 첫 글자만 표시
                verse.lines.forEach((line, lineIndex) => {
                    const hintLine = document.createElement('div');
                    hintLine.className = 'verse-line hint-line';
                    hintLine.textContent = line.charAt(0) + '...';
                    hintLine.style.fontSize = fontSize;
                    hintLine.style.color = '#ffffff';
                    hintLine.dataset.lineIndex = lineIndex;
                    hintContainer.appendChild(hintLine);
                });
                
                // 첫 글자들을 모아서 암기 문장 만들기 (마지막에 배치)
                const mnemonicText = verse.mnemonic || createMnemonic(verse.lines);
                const mnemonicSentence = document.createElement('div');
                mnemonicSentence.className = 'verse-line mnemonic-sentence';
                mnemonicSentence.style.fontSize = '32px';
                mnemonicSentence.style.color = '#FFD700';
                mnemonicSentence.style.fontWeight = 'bold';
                mnemonicSentence.style.marginTop = '30px';
                mnemonicSentence.style.padding = '15px 30px';
                mnemonicSentence.style.background = 'rgba(0,0,0,0.2)';
                mnemonicSentence.style.borderRadius = '15px';
                mnemonicSentence.textContent = `💡 ${mnemonicText}`;
                mnemonicSentence.dataset.lineIndex = verse.lines.length;
                hintContainer.appendChild(mnemonicSentence);
                
                hintSlide.appendChild(hintContainer);
                presentation.appendChild(hintSlide);
                
                // ===== 두 번째 슬라이드: 전체 본문 =====
                const fullSlide = document.createElement('div');
                fullSlide.className = `slide ${bgClass}`;
                fullSlide.dataset.slideType = 'full';
                
                // 슬라이드 번호
                const slideNum2 = document.createElement('div');
                slideNum2.className = 'slide-number';
                slideNum2.textContent = `#${verse.num}`;
                fullSlide.appendChild(slideNum2);
                
                // 성경 참조
                const ref2 = document.createElement('div');
                ref2.className = 'reference';
                ref2.textContent = verse.ref;
                fullSlide.appendChild(ref2);
                
                // 본문 컨테이너
                const verseContainer = document.createElement('div');
                verseContainer.className = 'verse-container';
                
                // 각 줄 생성
                verse.lines.forEach((line, lineIndex) => {
                    const verseLine = document.createElement('div');
                    verseLine.className = 'verse-line';
                    verseLine.textContent = line;
                    verseLine.style.fontSize = fontSize;
                    verseLine.style.color = '#ffffff';
                    verseLine.dataset.lineIndex = lineIndex;
                    verseContainer.appendChild(verseLine);
                });
                
                fullSlide.appendChild(verseContainer);
                presentation.appendChild(fullSlide);
            });
        }
        
        // 슬라이드 표시
        function showSlide(n) {
            const slides = document.querySelectorAll('.slide');
            
            if (n >= slides.length) {
                currentSlide = slides.length - 1;
            } else if (n < 0) {
                currentSlide = 0;
            } else {
                currentSlide = n;
            }
            
            slides.forEach(slide => slide.classList.remove('active'));
            slides[currentSlide].classList.add('active');
            
            // 모든 줄을 숨김 (첫 번째 줄도 포함)
            const lines = slides[currentSlide].querySelectorAll('.verse-line');
            lines.forEach(line => {
                line.classList.remove('show');
            });
            currentLine = -1; // -1로 시작하여 첫 클릭에 첫 번째 줄 표시
            
            // UI 업데이트
            updateUI();
        }
        
        // 다음 줄 또는 다음 슬라이드
        function showNextLine() {
            const slides = document.querySelectorAll('.slide');
            const lines = slides[currentSlide].querySelectorAll('.verse-line');
            
            if (currentLine < lines.length - 1) {
                currentLine++;
                lines[currentLine].classList.add('show');
            } else {
                nextSlide();
            }
        }
        
        function nextSlide() {
            showSlide(currentSlide + 1);
        }
        
        function prevSlide() {
            showSlide(currentSlide - 1);
        }
        
        // UI 업데이트
        function updateUI() {
            const slides = document.querySelectorAll('.slide');
            document.getElementById('slideCounter').textContent = `${currentSlide + 1} / ${slides.length}`;
            document.getElementById('progressBar').style.width = `${((currentSlide + 1) / slides.length) * 100}%`;
            
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === slides.length - 1;
        }
        
        // 키보드 이벤트
        document.addEventListener('keydown', (e) => {
            // 입력창 내부에서의 입력(스페이스바, 엔터 등)은 슬라이드 단축키로 인식하지 않고 무시함
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevSlide();
            } else if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                showNextLine();
            }
        });
        
        // 클릭 이벤트
        document.querySelector('.presentation-container').addEventListener('click', (e) => {
            if (!e.target.classList.contains('nav-button')) {
                showNextLine();
            }
        });
        
        // 초기화
        loadData();
    </script>
</body>
</html>
