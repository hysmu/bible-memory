<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성경 암송 자료</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: #1a1a1a;
            overflow: hidden;
            height: 100vh;
        }
        
        .presentation-container {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .slide {
            display: none;
            width: 90vw;
            max-width: 1200px;
            height: 80vh;
            border-radius: 20px;
            padding: 60px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .slide.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .slide-number {
            position: absolute;
            top: 30px;
            left: 40px;
            font-size: 28px;
            font-weight: bold;
            opacity: 0.5;
        }
        
        .reference {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
            color: #ffffff;
            position: relative;
            cursor: help;
        }
        
        /* Base Tooltip Styles */
        .reference[data-tooltip]::after,
        .quiz-ref[data-tooltip]::after,
        .wo-ref[data-tooltip]::after {
            content: attr(data-tooltip);
            position: absolute;
            background: rgba(0,0,0,0.85);
            color: #FFD700;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14.5px;
            font-weight: normal;
            white-space: normal;
            word-break: keep-all;
            line-height: 1.5;
            max-width: 280px;
            width: max-content;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
            
            /* 가로 위치: 왼쪽 기준 3/4 (75%) */
            left: 75%;
            transform: translateX(-50%);
        }

        .reference[data-tooltip]::before,
        .quiz-ref[data-tooltip]::before,
        .wo-ref[data-tooltip]::before {
            content: '';
            position: absolute;
            left: 75%;
            transform: translateX(-50%);
            border: 8px solid transparent;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            pointer-events: none;
            z-index: 10;
        }

        /* 1. Main Screen Reference (위로 열림) */
        .reference[data-tooltip]::after {
            bottom: 100%;
            margin-bottom: 10px;
        }
        .reference[data-tooltip]::before {
            bottom: 100%;
            margin-bottom: -6px;
            border-top-color: rgba(0,0,0,0.85);
        }
        .reference:hover::after,
        .reference:hover::before,
        .reference.active-tooltip::after,
        .reference.active-tooltip::before {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-5px);
        }

        /* 2. Quiz & Word Order Reference (아래로 열림) */
        .quiz-ref[data-tooltip]::after,
        .wo-ref[data-tooltip]::after {
            top: 66%;
            margin-top: 10px;
        }
        .quiz-ref[data-tooltip]::before,
        .wo-ref[data-tooltip]::before {
            top: 66%;
            margin-top: -6px;
            border-bottom-color: rgba(0,0,0,0.85);
        }
        .quiz-ref:hover::after,
        .wo-ref:hover::after,
        .quiz-ref:hover::before,
        .wo-ref:hover::before,
        .quiz-ref.active-tooltip::after,
        .wo-ref.active-tooltip::after,
        .quiz-ref.active-tooltip::before,
        .wo-ref.active-tooltip::before {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(5px);
        }
        
        .verse-container {
            text-align: center;
            max-width: 900px;
        }
        
        .verse-line {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            margin: 8px 0;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        
        .verse-line.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 힌트 슬라이드의 첫 글자 스타일 */
        .hint-line {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            margin: 8px 0;
            line-height: 1.4;
        }
        
        .hint-line.show {
            opacity: 0.8;
            transform: translateY(0);
        }
        
        /* 암기 문장 스타일 */
        .mnemonic-sentence {
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.6s ease;
        }
        
        .mnemonic-sentence.show {
            opacity: 1;
            transform: scale(1);
        }
        
        /* 배경 색상 그룹 */
        .bg-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .bg-2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .bg-3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .bg-4 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .bg-5 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        
        /* 타이틀 슬라이드 */
        .title-slide {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        .title-slide h1 {
            font-size: 72px;
            margin-bottom: 30px;
            color: #ffffff;
        }
        
        .title-slide p {
            font-size: 36px;
            color: rgba(255,255,255,0.8);
        }
        
        /* 네비게이션 */
        .nav-buttons {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 1000;
        }
        
        .nav-button {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        
        .nav-button:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        
        .nav-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: rgba(255,255,255,0.8);
            transition: width 0.3s;
            z-index: 1000;
        }
        
        .slide-counter {
            position: fixed;
            top: 20px;
            right: 40px;
            color: rgba(255,255,255,0.7);
            font-size: 18px;
            z-index: 1000;
        }
        
        .instruction {
            position: fixed;
            bottom: 155px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            text-align: center;
            z-index: 1000;
            white-space: nowrap;
        }
    
        /* 관리자 UI 스타일 */
        .management-ui {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f4f6f8;
            z-index: 2000;
            overflow-y: auto;
            color: #333;
            font-family: 'Noto Sans KR', sans-serif;
            padding: 20px;
        }
        .management-ui.active {
            display: block;
        }
        .mgmt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .mgmt-header h2 { margin: 0; color: #2c3e50; }
        .btn {
            padding: 8px 16px; border: none; border-radius: 5px;
            cursor: pointer; font-weight: bold; font-size: 14px;
            transition: all 0.2s;
        }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: #95a5a6; color: white; }
        .btn-secondary:hover { background: #7f8c8d; }
        .btn-purple { background: #8e44ad; color: white; }
        .btn-purple:hover { background: #6c3483; }
        
        .verse-table-container {
            background: white; border-radius: 10px; padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; font-weight: bold; }
        tr:hover { background: #f1f2f6; }
        tr:has(.row-chk:checked) { background: #fef9e7; }
        
        /* 모달 스타일 */
        .modal-overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 3000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: white; padding: 25px; border-radius: 10px;
            width: 500px; max-width: 90%; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;
            font-family: inherit; font-size: 14px;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        
        .top-right-btns { position: fixed; top: 20px; left: 20px; z-index: 1001; display: flex; gap: 10px; }

        /* ── 모드 버튼 바 ── */
        .mode-bar { position: fixed; bottom: 105px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 1000; flex-wrap: wrap; justify-content: center; }
        .mode-bar button { background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.32); color: white; padding: 6px 15px; border-radius: 18px; font-size: 13px; cursor: pointer; transition: all 0.2s; backdrop-filter: blur(8px); font-family: inherit; }
        .mode-bar button:hover { background: rgba(255,255,255,0.26); }
        .tts-btn { background: rgba(255,255,255,0.13); border: 2px solid rgba(255,255,255,0.38); color: white; padding: 6px 15px; border-radius: 18px; font-size: 13px; cursor: pointer; transition: all 0.2s; backdrop-filter: blur(8px); font-family: inherit; }
        .tts-btn:hover { background: rgba(255,255,255,0.26); }
        .tts-btn.speaking { background: rgba(255,215,0,0.28); border-color:#FFD700; color:#FFD700; }

        /* ── 공통 오버레이 ── */
        .quiz-overlay, .word-order-overlay, .review-panel { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 4000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .quiz-overlay.active, .word-order-overlay.active, .review-panel.active { display: flex; }

        /* ── 빈칸 퀴즈 ── */
        .quiz-box { background: #1e1e2e; border-radius: 20px; padding: 36px; max-width: 820px; width: 100%; color: white; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.6); max-height: 90vh; overflow-y: auto; }
        .quiz-ref { font-size: 26px; font-weight: bold; margin-bottom: 14px; color: #FFD700; position: relative; cursor: help; }
        .quiz-verse { font-size: 21px; line-height: 2.1; margin-bottom: 18px; }
        .quiz-blank { display: inline-block; border-bottom: 3px solid #FFD700; min-width: 68px; color: #FFD700; padding: 2px 8px; border-radius: 4px; background: rgba(255,215,0,0.1); }
        .quiz-blank.active-blank { outline: 2px solid #FFD700; outline-offset: 2px; }
        .quiz-blank.correct { color: #2ecc71; border-color: #2ecc71; background: rgba(46,204,113,0.15); outline: none; }
        .quiz-blank.wrong   { color: #e74c3c; border-color: #e74c3c; background: rgba(231,76,60,0.15); outline: none; animation: shake 0.3s; }
        .quiz-blank.hint-shown { color: #f39c12; border-color: #f39c12; background: rgba(243,156,18,0.12); outline: none; font-style: italic; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
        .quiz-input-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
        .quiz-input { font-size: 18px; padding: 10px 14px; border-radius: 10px; border: 2px solid #555; background: #2a2a3e; color: white; width: 200px; text-align: center; font-family: inherit; }
        .quiz-result { font-size: 19px; margin-top: 8px; min-height: 26px; }
        .quiz-score { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 10px; }
        .quiz-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
        .quiz-btn { padding: 8px 18px; border: none; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit; transition: all 0.2s; }
        .quiz-btn-primary   { background: #3498db; color: white; } .quiz-btn-primary:hover   { background: #2980b9; }
        .quiz-btn-warn      { background: #f39c12; color: white; } .quiz-btn-warn:hover      { background: #d68910; }
        .quiz-btn-success   { background: #27ae60; color: white; } .quiz-btn-success:hover   { background: #219a52; }
        .quiz-btn-secondary { background: #555;    color: white; } .quiz-btn-secondary:hover { background: #777; }

        /* ── 단어 순서 맞추기 (드래그&드롭) ── */
        .word-order-box { background: #1e1e2e; border-radius: 20px; padding: 28px; max-width: 900px; width: 100%; color: white; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.6); max-height: 92vh; overflow-y: auto; }
        .wo-ref  { font-size: 22px; font-weight: bold; color: #FFD700; margin-bottom: 4px; position: relative; cursor: help; }
        .wo-sub  { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 4px; }
        /* 힌트: 각 줄 첫 글자 */
        .wo-hint-lines { background: rgba(255,255,255,0.07); border-radius: 10px; padding: 10px 16px; margin: 8px 0; font-size: 14px; color: rgba(255,255,255,0.65); line-height: 2; text-align: left; }
        /* 정답 drop zone */
        .wo-answer-area { min-height: 60px; border: 2px dashed rgba(255,255,255,0.28); border-radius: 14px; padding: 10px 14px; margin: 8px 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; transition: background 0.2s, border-color 0.2s; }
        .wo-answer-area.drag-over { background: rgba(52,152,219,0.15); border-color: #3498db; }
        /* 단어 칩 */
        .wo-chip { padding: 7px 15px; border-radius: 22px; font-size: 15px; font-weight: bold; cursor: grab; user-select: none; transition: transform 0.15s, opacity 0.15s; font-family: inherit; border: none; touch-action: none; display: inline-block; }
        .wo-chip:active { cursor: grabbing; }
        .wo-chip.pool-chip { background: #3a3a5c; color: white; }
        .wo-chip.pool-chip:hover { background: #5050a0; transform: scale(1.06); }
        .wo-chip.ans-chip  { background: #2980b9; color: white; }
        .wo-chip.ans-chip:hover  { background: #1f6697; transform: scale(1.04); }
        .wo-chip.dragging  { opacity: 0.25; transform: scale(0.88); }
        .wo-chip.correct-chip { background: #27ae60 !important; cursor: default; }
        .wo-chip.wrong-chip   { background: #c0392b !important; animation: shake 0.35s; }
        .wo-word-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 48px; margin: 8px 0; }
        .wo-feedback { font-size: 19px; min-height: 26px; margin: 6px 0; }
        .wo-progress { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 4px; }
        /* 줄별 정답 행 */
        .wo-answer-area { flex-direction: column; gap: 6px; align-items: stretch; padding: 10px; }
        .wo-answer-row {
            display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
            min-height: 46px; padding: 8px 12px; border-radius: 10px;
            background: rgba(255,255,255,0.06); border: 1.5px dashed rgba(255,255,255,0.2);
            transition: background 0.2s, border-color 0.2s;
        }
        .wo-answer-row.drag-over { background: rgba(52,152,219,0.18); border-color: #3498db; }
        .wo-row-label {
            font-size: 12px; color: rgba(255,255,255,0.35);
            margin-right: 4px; white-space: nowrap; user-select: none;
        }
        /* 정답 짧게 보이기 */
        .wo-answer-reveal { border-radius: 10px; padding: 10px 16px; font-size: 14px; color: #FFD700; margin: 6px 0; display: none; line-height: 1.9; background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.3); text-align: left; }
        .wo-answer-reveal.show { display: block; animation: revealFade 3.5s forwards; }
        @keyframes revealFade { 0%{opacity:0} 8%{opacity:1} 75%{opacity:1} 100%{opacity:0} }

        /* ── 암기 완료 배지 ── */
        .memorized-badge { position: absolute; top: 18px; right: 18px; font-size: 13px; cursor: pointer; user-select: none; background: rgba(0,0,0,0.22); border-radius: 50px; padding: 5px 12px; transition: all 0.2s; z-index: 10; border: 1.5px solid rgba(255,255,255,0.22); }
        .memorized-badge:hover { background: rgba(0,0,0,0.42); transform: scale(1.08); }
        .memorized-badge.done { background: rgba(46,204,113,0.32); border-color: #2ecc71; }

        /* ── 복습 패널 ── */
        .review-panel-box { background: white; border-radius: 16px; padding: 28px; max-width: 680px; width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
        .review-section { margin-bottom: 20px; }
        .review-section h3 { font-size: 14px; color: #555; margin-bottom: 8px; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        .review-chip { display: inline-block; padding: 5px 12px; margin: 3px; border-radius: 16px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .chip-today { background: #e74c3c; color: white; } .chip-soon { background: #f39c12; color: white; }
        .chip-ok    { background: #27ae60; color: white; } .chip-none { background: #ecf0f1; color: #555; }
        .review-progress-bar { height: 12px; border-radius: 10px; background: #ecf0f1; overflow: hidden; margin: 8px 0; }
        .review-progress-fill { height: 100%; background: linear-gradient(90deg,#27ae60,#2ecc71); border-radius: 10px; transition: width 0.5s; }

    </style>
</head>
<body>
    
    <div class="top-right-btns">
        <button class="nav-button" onclick="toggleManagementUI()" style="padding: 8px 16px; font-size:14px;">⚙️ 관리자 모드</button>
    </div>

    
    <!-- 관리자 UI -->
    <div class="management-ui" id="managementUI">
        <div class="mgmt-header">
            <h2>성경 암송 자료 관리</h2>
            <div style="display:flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn btn-secondary" onclick="exportDataWithPicker()">JSON 백업</button>
                <input type="file" id="importFile" style="display:none;" accept=".json" onchange="processImportEvent(event)">
                <button class="btn btn-secondary" onclick="importDataWithPicker()">JSON 복원</button>
                <button class="btn btn-primary" onclick="openModal('add')">+ 새 구절 추가</button>
                <button class="btn btn-secondary" onclick="toggleManagementUI()">닫기 ✖</button>
            </div>
        </div>
        
        <div class="verse-table-container">
            <div style="margin-bottom: 15px; display:flex; gap: 10px; align-items:center; flex-wrap: wrap; background: #f8f9fa; padding: 10px; border-radius: 8px;">
                <label style="font-weight:bold;">현재 자료 선택:</label>
                <select id="datasetSelector" onchange="changeDataset(this.value)" style="padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc; font-weight:bold; min-width:150px;">
                </select>
                <button class="btn btn-primary" style="padding: 4px 10px; font-size:12px;" onclick="createNewDataset()">새 자료 만들기</button>
                <button class="btn btn-secondary" style="padding: 4px 10px; font-size:12px;" onclick="renameCurrentDataset()">현재 이름 변경</button>
                <button class="btn btn-danger" style="padding: 4px 10px; font-size:12px;" onclick="deleteCurrentDataset()">현재 자료 삭제</button>
                <button class="btn btn-primary" style="padding: 4px 10px; font-size:12px; background:#8e44ad;" onclick="saveAsDataset()">📋 다른 이름으로 저장</button>
                <div style="display:flex; align-items:center; gap: 8px; background: #e8f4f8; padding: 5px 10px; border-radius: 8px; margin-left: auto;">
                    <label style="font-weight:bold; font-size:13px; color:#333;">🗣️ 읽기 속도:</label>
                    <input type="range" id="ttsSpeedSlider" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('ttsSpeedVal').textContent = parseFloat(this.value).toFixed(1) + 'x'" onchange="changeTtsSpeed(this.value)" style="width: 80px;">
                    <span id="ttsSpeedVal" style="font-size:12px; font-weight:bold; color:#333;">1.0x</span>
                </div>
            </div>
            <!-- 다중 선택 삭제 툴바 -->
            <div id="bulkDeleteBar" style="display:none; align-items:center; gap:12px; background:#fff3cd; border:1px solid #ffc107; border-radius:8px; padding:10px 16px; margin-bottom:12px;">

        // 첫 글자로 암기 문장 만들기
        function createMnemonic(lines) {
            // 각 줄의 첫 글자 추출
            const firstChars = lines
                .map(line => line.trim())
                .filter(line => line.length > 0)
                .map(line => line.charAt(0));
            
            // 첫 글자들을 합치기
            const mnemonic = firstChars.join('');
            
            // 3글자마다 공백 추가해서 읽기 쉽게
            let formatted = '';
            for (let i = 0; i < mnemonic.length; i++) {
                formatted += mnemonic[i];
                if ((i + 1) % 3 === 0 && i < mnemonic.length - 1) {
                    formatted += ' ';
                }
            }
            
            return `"${formatted}" 으로 기억하세요!`;
        }

        
        let bibleDatasets = { "기본 자료": [] };
        let currentDatasetName = "기본 자료";

                function bindTooltipEvents(el, summaryText) {
            if (!summaryText) return;
            el.dataset.tooltip = summaryText;
            
            // Mouse events for PC
            el.addEventListener('mouseenter', () => playTTS(summaryText));
            el.addEventListener('mouseleave', () => stopTTS());
            
            // Click/Touch events for Mobile
            el.addEventListener('click', (e) => {
                e.stopPropagation(); 
                const isActive = el.classList.contains('active-tooltip');
                
                document.querySelectorAll('.active-tooltip').forEach(node => {
                    node.classList.remove('active-tooltip');
                });
                
                if (isActive) {
                    stopTTS();
                } else {
                    el.classList.add('active-tooltip');
                    playTTS(summaryText);
                }
            });
        }
        
        document.addEventListener('click', () => {
            const activeTooltips = document.querySelectorAll('.active-tooltip');
            if (activeTooltips.length > 0) {
                activeTooltips.forEach(node => node.classList.remove('active-tooltip'));
                stopTTS();
            }
        });

        const STORAGE_KEY = 'bible_memory_verses_data';

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed)) {
                        bibleDatasets = { "기본 자료": parsed };
                    } else {
                        bibleDatasets = parsed;
                    }
                } catch (e) {
                    console.error('Data parse error', e);
                    initDefaultData();
                }
            } else {
                initDefaultData();
            }
            
            if(Object.keys(bibleDatasets).length === 0) {
                initDefaultData();
            }
            
            const lastActive = localStorage.getItem('bible_memory_active_dataset');
            if(lastActive && bibleDatasets[lastActive]) {
                currentDatasetName = lastActive;
            } else {
                currentDatasetName = Object.keys(bibleDatasets)[0];
            }
            
            appData = bibleDatasets[currentDatasetName];
            
            let modified = false;
            Object.values(bibleDatasets).forEach(dataset => {
                dataset.forEach((v, index) => {
                    if (v.lines) {
                        let newLines = [];
                        let changed = false;
                        v.lines.forEach(line => {
                            if (typeof line === 'string' && line.includes('\\n')) {
                                newLines.push(...line.split('\\n'));
                                changed = true;
                            } else {
                                newLines.push(line);
                            }
                        });
                        if (changed) {
                            v.lines = newLines;
                            modified = true;
                        }
                    }
                    if (!v.id) { v.id = Date.now() + Math.random(); modified = true; }
                    if (!v.mnemonic && v.lines) { 
                        v.mnemonic = createMnemonic(v.lines); 
                        modified = true; 
                    }
                    if (!v.summary) {
                        const defaultV = defaultVerses.find(dv => dv.ref === v.ref);
                        if (defaultV && defaultV.summary) {
                            v.summary = defaultV.summary;
                            modified = true;
                        }
                    }
                });
            });
            if(modified) saveData();
            
            const speedSlider = document.getElementById('ttsSpeedSlider');
            if(speedSlider) {
                speedSlider.value = ttsSpeed;
                document.getElementById('ttsSpeedVal').textContent = ttsSpeed.toFixed(1) + 'x';
            }
            
            createSlides();
            showSlide(0);
        }

            bibleDatasets = { "기본 자료": defaultData };
            currentDatasetName = "기본 자료";
            appData = bibleDatasets[currentDatasetName];
            saveData();

        function onRowCheckChange() {
            const all = document.querySelectorAll('.row-chk');
            const checked = document.querySelectorAll('.row-chk:checked');
            document.getElementById('selectAllChk').checked = all.length > 0 && checked.length === all.length;
            document.getElementById('selectAllChk').indeterminate = checked.length > 0 && checked.length < all.length;
            const bar = document.getElementById('bulkDeleteBar');
            if (checked.length > 0) {
                bar.style.display = 'flex';
                document.getElementById('selectedCountLabel').textContent = `${checked.length}개 선택됨`;
            } else {
                bar.style.display = 'none';
            }
        }

        function deleteSelectedVerses() {
            const checked = document.querySelectorAll('.row-chk:checked');
            if (checked.length === 0) return;
            if (!confirm(`선택한 ${checked.length}개 구절을 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.`)) return;
            const ids = new Set([...checked].map(chk => Number(chk.dataset.id)));
            appData = appData.filter(v => !ids.has(Number(v.id)));
            bibleDatasets[currentDatasetName] = appData;
            saveData();
            renderTable();
        }

            const linesStr = document.getElementById('inputLines').value.trim();

            if(linesStr && inputMnemonic.value.trim() === '') {
                const lines = linesStr.split('\n').map(l => l.trimEnd()).filter(l => l.trim() !== '');
                inputMnemonic.value = createMnemonic(lines);
            }
        }

        function openModal(mode, id = null) {
            const modal = document.getElementById('verseModal');
            document.getElementById('modalTitle').textContent = mode === 'add' ? '새 구절 추가' : '구절 수정';
            
            if (mode === 'edit') {
                const verse = appData.find(v => v.id === id);
                if(verse) {
                    document.getElementById('editId').value = verse.id;
                    document.getElementById('inputRef').value = verse.ref;
                    document.getElementById('inputLines').value = verse.lines.join('\n');
                    document.getElementById('inputMnemonic').value = verse.mnemonic || '';
                    document.getElementById('inputSummary').value = verse.summary || '';
                    document.getElementById('inputIcon').value = verse.icon || '';
                }
            } else {
                document.getElementById('editId').value = '';
                document.getElementById('inputRef').value = '';
                document.getElementById('inputLines').value = '';
                document.getElementById('inputMnemonic').value = '';
                document.getElementById('inputSummary').value = '';
                document.getElementById('inputIcon').value = '✨';
            }
            
            modal.classList.add('active');
        }

            const finalMnemonic = mnemonic || createMnemonic(lines);
            
            if (id) {
                const idx = appData.findIndex(v => v.id == id);
                if(idx !== -1) {
                    appData[idx] = { ...appData[idx], ref, lines, mnemonic: finalMnemonic, summary, icon };
                }
            } else {
                const newId = Date.now();
                appData.push({ id: newId, num: appData.length + 1, ref, lines, mnemonic: finalMnemonic, summary, icon });
            }
            
            saveData();
            closeModal();
            renderTable();
        }

                        updateDatasetSelector();

                    }
                } catch(err) {

        // 슬라이드 표시
        function showSlide(n) {
            const slides = document.querySelectorAll('.slide');
            
            if (n >= slides.length) {
                currentSlide = slides.length - 1;
            } else if (n < 0) {
                currentSlide = 0;
            } else {
                currentSlide = n;
            }
            
            slides.forEach(slide => slide.classList.remove('active'));
            slides[currentSlide].classList.add('active');
            
            // 모든 줄을 숨김 (첫 번째 줄도 포함)
            const lines = slides[currentSlide].querySelectorAll('.verse-line');
            lines.forEach(line => {
                line.classList.remove('show');
            });
            currentLine = -1; // -1로 시작하여 첫 클릭에 첫 번째 줄 표시
            
            // UI 업데이트
            updateUI();
        }
        
        // 다음 줄 또는 다음 슬라이드
        function showNextLine() {
            const slides = document.querySelectorAll('.slide');
            const lines = slides[currentSlide].querySelectorAll('.verse-line');
            
            if (currentLine < lines.length - 1) {
                currentLine++;
                lines[currentLine].classList.add('show');
            } else {
                nextSlide();
            }
        }
        
        function nextSlide() {
            showSlide(currentSlide + 1);
        }
        
        function prevSlide() {
            showSlide(currentSlide - 1);
        }

        function goToFirst() {
            showSlide(0);
        }
        
        // UI 업데이트
        function updateUI() {
            const slides = document.querySelectorAll('.slide');
            document.getElementById('slideCounter').textContent = `${currentSlide + 1} / ${slides.length}`;
            document.getElementById('progressBar').style.width = `${((currentSlide + 1) / slides.length) * 100}%`;
            
            document.getElementById('firstBtn').disabled = currentSlide === 0;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === slides.length - 1;
        }
        
        // 키보드 이벤트
        document.addEventListener('keydown', (e) => {
            // 입력창 내부에서의 입력(스페이스바, 엔터 등)은 슬라이드 단축키로 인식하지 않고 무시함
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevSlide();
            } else if (e.key === ' ' || e.key === 'Enter') {

                showNextLine();
            }

        function loadMemorized() { try { memorizedData = JSON.parse(localStorage.getItem('bible_memorized')||'{}'); } catch(e){ memorizedData={}; } }
        function saveMemorized() { localStorage.setItem('bible_memorized', JSON.stringify(memorizedData)); }

        const _origCS = createSlides;

        // ══════════════════════════════════════════
        // ② 복습 일정 패널
        // ══════════════════════════════════════════
        const REVIEW_INTERVALS = [1,3,7,14,30];
        let reviewData = {};
        function loadReview()  { try { reviewData = JSON.parse(localStorage.getItem('bible_review')||'{}'); } catch(e){ reviewData={}; } }
        function saveReview()  { localStorage.setItem('bible_review', JSON.stringify(reviewData)); }
        loadReview();

        function scheduleReview(vid, correct) {
            const r = reviewData[vid] || { level:0 };
            r.level = correct ? Math.min(r.level+1, REVIEW_INTERVALS.length) : 0;
            const days = r.level < REVIEW_INTERVALS.length ? REVIEW_INTERVALS[r.level] : 365;
            r.nextReview = Date.now() + days*86400000;
            reviewData[vid] = r; saveReview();
        }
        function openReviewPanel()  { renderReviewPanel(); document.getElementById('reviewPanel').classList.add('active'); }
        function closeReviewPanel() { document.getElementById('reviewPanel').classList.remove('active'); }

        function renderReviewPanel() {
            const now = Date.now();
            const todayL=[], soonL=[], okL=[], noneL=[];
            appData.forEach(v => {
                const r = reviewData[v.id], m = memorizedData[v.id];
                if (!r) { noneL.push(v); return; }
                if (r.nextReview <= now) todayL.push(v);
                else if (r.nextReview <= now+7*86400000) soonL.push(v);
                else okL.push(v);
            });
            const mc = appData.filter(v=>memorizedData[v.id]?.done).length;
            const pct = appData.length ? Math.round(mc/appData.length*100) : 0;
            let h = `<div class="review-section"><h3>📊 전체 암기 진도</h3>
                <div style="font-size:15px;margin-bottom:6px;"><b>${mc}</b> / ${appData.length} 구절 (<b>${pct}%</b>)</div>
                <div class="review-progress-bar"><div class="review-progress-fill" style="width:${pct}%"></div></div></div>`;
            if(todayL.length) { h+=`<div class="review-section"><h3>🔴 오늘 복습 (${todayL.length})</h3>`; todayL.forEach(v=>{ h+=`<span class="review-chip chip-today" onclick="closeReviewPanel();jumpToVerse(${v.id})">${v.ref}</span>`; }); h+='</div>'; }
            if(soonL.length)  { h+=`<div class="review-section"><h3>🟡 이번 주 예정 (${soonL.length})</h3>`; soonL.forEach(v=>{ const d=Math.ceil((reviewData[v.id].nextReview-now)/86400000); h+=`<span class="review-chip chip-soon" onclick="closeReviewPanel();jumpToVerse(${v.id})">${v.ref} <small>(${d}일 후)</small></span>`; }); h+='</div>'; }
            if(okL.length)    { h+=`<div class="review-section"><h3>🟢 복습 완료 (${okL.length})</h3>`; okL.forEach(v=>{ h+=`<span class="review-chip chip-ok">${v.ref}</span>`; }); h+='</div>'; }
            if(noneL.length)  { h+=`<div class="review-section"><h3>⬜ 미학습 (${noneL.length})</h3>`; noneL.forEach(v=>{ h+=`<span class="review-chip chip-none" onclick="closeReviewPanel();jumpToVerse(${v.id})">${v.ref}</span>`; }); h+='</div>'; }
            document.getElementById('reviewPanelContent').innerHTML = h;
        }

        // ══════════════════════════════════════════
        // ③ 빈칸 퀴즈 (힌트 & 정답 보기 포함)

        let quizList=[], quizIdx=0, quizCorrect=0, quizTotal=0;
        let quizBlanks=[], quizAnswers=[], quizBlankIdx=0, quizDone=false;

        function openQuizMode() {
            quizList = [...appData].filter(v=>v.lines?.length).sort(()=>Math.random()-.5);
            if (!quizList.length) { alert('구절 데이터가 없습니다.'); return; }

        function closeQuiz() { speechSynthesis.cancel(); document.getElementById('quizOverlay').classList.remove('active'); }

        function renderQuiz() {
            quizDone = false;
            document.getElementById('quizNextBtn').style.display = 'none';
            document.getElementById('quizTtsBtn').style.display = 'none';
            document.getElementById('quizHintBtn').disabled = false;
            const verse = quizList[quizIdx];
            const words = verse.lines.join(' ').split(/\s+/).filter(Boolean);
            const cnt = Math.max(1, Math.round(words.length * 0.3));
            const idxSet = new Set();
            while(idxSet.size < cnt) idxSet.add(Math.floor(Math.random()*words.length));

            quizAnswers=[]; quizBlanks=[]; quizBlankIdx=0;
            let pos=0, html='';
            verse.lines.forEach((line,li) => {
                line.split(/\s+/).filter(Boolean).forEach(w => {
                    if(idxSet.has(pos)) {
                        const bid=`qb${quizBlanks.length}`;
                        quizBlanks.push(bid);
                        quizAnswers.push(w.replace(/[.,!?]/g,''));
                        html += `<span class="quiz-blank" id="${bid}" data-ans="${w.replace(/[.,!?]/g,'')}">　　　</span> `;
                    } else { html += `<span>${w}</span> `; }
                    pos++;
                });
                if(li<verse.lines.length-1) html+='<br>';
            });

            let qRef = document.getElementById('quizRef');

                bindTooltipEvents(newQRef, verse.summary);
            }
            qRef.replaceWith(newQRef);
            document.getElementById('quizVerse').innerHTML = html;
            document.getElementById('quizResult').textContent = '';
            document.getElementById('quizInput').value = '';
            document.getElementById('quizScore').textContent = `문제 ${quizIdx+1}/${quizList.length}  ·  정답 ${quizCorrect}/${quizTotal}`;
            if(quizBlanks.length) document.getElementById(quizBlanks[0]).classList.add('active-blank');
            document.getElementById('quizInput').focus();
        }

        
        const successMessages = [
            "🎉 정답입니다! 정말 잘하셨어요!",
            "✨ 완벽해요! 대단합니다!",
            "👏 훌륭합니다! 정확히 맞추셨어요!",
            "🎊 최고예요! 아주 잘하셨습니다!",
            "🌟 참 잘했어요! 멋집니다!"
        ];
        function playSuccessSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                const playNote = (freq, start, dur) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, ctx.currentTime + start);
                    gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + start + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + start + dur);
                    osc.start(ctx.currentTime + start);
                    osc.stop(ctx.currentTime + start + dur);
                };
                playNote(523.25, 0.0, 0.4); 
                playNote(659.25, 0.1, 0.4); 
                playNote(783.99, 0.2, 0.4); 
                playNote(1046.50, 0.3, 0.8); 

                const bufferSize = ctx.sampleRate * 6; 
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1; 
                }
                const noiseSource = ctx.createBufferSource();
                noiseSource.buffer = buffer;
                
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 800; 
                filter.Q.value = 0.5; 
                
                const gainNode = ctx.createGain();
                gainNode.gain.setValueAtTime(0, ctx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.5); 
                gainNode.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 3.0); 
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 6.0); 
                
                noiseSource.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(ctx.destination);
                noiseSource.start();
            } catch (e) {
                console.error("Audio API error", e);
            }
        }

        function triggerSuccessEffect(elementId, readVerseFallback) {
            const msg = successMessages[Math.floor(Math.random() * successMessages.length)];
            const el = document.getElementById(elementId);
            if(el) el.textContent = msg;
            
            playSuccessSound();
            
            playTTS(msg.replace(/[🎉✨👏🎊🌟]/g, ''));
            setTimeout(() => {
                if(readVerseFallback) readVerseFallback();
            }, 4500);
        }

function checkQuizAnswer(isAuto = false) {
            if(quizDone) return;
            const input = document.getElementById('quizInput').value.trim();
            if(!input || quizBlankIdx >= quizBlanks.length) return;
            
            const ans = quizAnswers[quizBlankIdx];
            const ok = input === ans || input.replace(/\s/g,'') === ans.replace(/\s/g,'');
            
            if (isAuto && !ok) return; 
            
            const el = document.getElementById(quizBlanks[quizBlankIdx]);
            quizTotal++;
            el.textContent = ans;
            el.classList.remove('active-blank');
            el.classList.add(ok ? 'correct' : 'wrong');
            document.getElementById('quizResult').textContent = ok ? '✅ 정답!' : `❌ 오답 (정답: ${ans})`;
            if(ok) quizCorrect++;
            else scheduleReview(quizList[quizIdx].id, false);
            document.getElementById('quizInput').value = '';
            quizBlankIdx++;
            if(quizBlankIdx < quizBlanks.length) {
                document.getElementById(quizBlanks[quizBlankIdx]).classList.add('active-blank');
                document.getElementById('quizInput').focus();
            } else {
                quizDone = true;
                scheduleReview(quizList[quizIdx].id, quizCorrect === quizTotal);
                document.getElementById('quizScore').textContent = `문제 ${quizIdx+1}/${quizList.length}  ·  정답 ${quizCorrect}/${quizTotal}`;
                document.getElementById('quizNextBtn').style.display = 'inline-block';
                document.getElementById('quizTtsBtn').style.display = 'inline-block';
                
                if(quizCorrect === quizTotal) {
                    triggerSuccessEffect('quizResult', () => ttsSpeak(quizList[quizIdx].lines.join(' ')));
                } else {
                    ttsSpeak(quizList[quizIdx].lines.join(' '));
                }
            }
        }

        function showQuizHint() {
            if(quizDone || quizBlankIdx >= quizBlanks.length) return;
            const el = document.getElementById(quizBlanks[quizBlankIdx]);
            const ans = quizAnswers[quizBlankIdx];
            // 첫 글자만 보여주기
            document.getElementById('quizResult').textContent = `💡 힌트: "${ans.charAt(0)}..."`;
            // 힌트 버튼 비활성화 (한 번만)
            document.getElementById('quizHintBtn').disabled = true;
        }

        function skipQuiz() {
            if(quizBlankIdx < quizBlanks.length) {
                const el = document.getElementById(quizBlanks[quizBlankIdx]);
                el.textContent = quizAnswers[quizBlankIdx];
                el.classList.add('hint-shown');
                quizBlankIdx++;
                if(quizBlankIdx < quizBlanks.length)
                    document.getElementById(quizBlanks[quizBlankIdx]).classList.add('active-blank');
                document.getElementById('quizHintBtn').disabled = false;
            }
            if(quizBlankIdx >= quizBlanks.length) {
                quizDone = true;
                scheduleReview(quizList[quizIdx].id, false);
                ttsSpeak(quizList[quizIdx].lines.join(' '));
                document.getElementById('quizNextBtn').style.display = 'inline-block';
            }
        }

        function restartQuiz() {
            quizBlankIdx = 0;
            renderQuiz();
        }

        function quizTtsAgain() {
            ttsSpeak(quizList[quizIdx].lines.join(' '));
        }

        function nextQuiz() {
            quizIdx++;
            quizBlankIdx = 0;
            if(quizIdx >= quizList.length) { alert(`완료! 정답률: ${quizTotal?Math.round(quizCorrect/quizTotal*100):0}%`); closeQuiz(); return; }
            renderQuiz();
        }

        // ══════════════════════════════════════════
        // ④ 단어 순서 맞추기 — 드래그&드롭
        // ══════════════════════════════════════════
        let woList=[], woIdx=0, woCorrect=[], woPool=[], woLines=[];
        let woDragChip=null, woDragFrom='', woDragFromRow=-1;
        let woLevel=1;

        function woToggleLevel() {
            woLevel = woLevel === 1 ? 2 : 1;
            document.getElementById('woLevelBtn').textContent = woLevel === 1 ? '✨ 1단계' : '🔥 2단계';
            renderWordOrder();
        }

        function openWordOrderMode() {
            woList = [...appData].filter(v=>v.lines?.length).sort(()=>Math.random()-.5);
            if(!woList.length) { alert('구절 데이터가 없습니다.'); return; }
            woIdx=0;
            document.getElementById('wordOrderOverlay').classList.add('active');
            renderWordOrder();
        }
        function closeWordOrder() { speechSynthesis.cancel(); document.getElementById('wordOrderOverlay').classList.remove('active'); }

        function renderWordOrder() {
            const verse = woList[woIdx % woList.length];
            // 줄별 단어 배열 저장
            woLines = verse.lines.map(l => l.split(/\s+/).filter(Boolean));
            woCorrect = verse.lines.join(' ').split(/\s+/).filter(Boolean);
            woPool = [...woCorrect].sort(()=>Math.random()-.5);

            let wRef = document.getElementById('woRef');
            const newWRef = wRef.cloneNode(false);
            newWRef.textContent = verse.ref;
            if(verse.summary) {
                bindTooltipEvents(newWRef, verse.summary);
            }
            wRef.replaceWith(newWRef);
            document.getElementById('woProgress').textContent = `${woIdx+1} / ${woList.length} 구절`;

            // 힌트 초기화
            const hintEl = document.getElementById('woHintLines');
            hintEl.innerHTML = verse.lines.map(l=>`<b>${l.charAt(0)}</b>${l.slice(1)}`).join('<br>');
            hintEl.style.display = 'none';
            const hintBtn = document.querySelector('[onclick="woToggleHint(this)"]');
            if(hintBtn) hintBtn.textContent = '💡 힌트';

            document.getElementById('woFeedback').textContent = '';
            document.getElementById('woTtsBtn').style.display = 'none';

            // 줄별 정답 행 생성
            const ansArea = document.getElementById('woAnswerArea');
            ansArea.innerHTML = '';
            woLines.forEach((lineWords, rowIdx) => {
                const row = document.createElement('div');
                row.className = 'wo-answer-row';
                row.dataset.rowIdx = rowIdx;
                const label = document.createElement('span');
                label.className = 'wo-row-label';
                label.textContent = `${rowIdx+1}줄`;
                row.appendChild(label);
                
                // drag 이벤트
                row.addEventListener('dragover', e => { 
                    e.preventDefault(); 
                    row.classList.add('drag-over'); 
                    if(!woDragChip) return;
                    const afterElement = getDragAfterElement(row, e.clientX, e.clientY);
                    if (afterElement) row.insertBefore(woDragChip, afterElement);
                    else row.appendChild(woDragChip);
                });
                row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
                row.addEventListener('drop', e => { 
                    e.preventDefault(); 
                    row.classList.remove('drag-over'); 
                    if(woDragChip) woDragChip.classList.remove('dragging'); 
                    document.getElementById('woFeedback').textContent = ''; 
                    woCheck(true);
                });
                ansArea.appendChild(row);
                
                if (woLevel === 1) {
                    const shuffled = [...lineWords].sort(()=>Math.random()-.5);
                    shuffled.forEach(w => row.appendChild(makeWoChip(w, Date.now() + Math.random(), 'answer', rowIdx)));
                }
            });

            document.getElementById('woWordPool').style.display = (woLevel === 1) ? 'none' : 'flex';
            if(woLevel === 2) renderWoPool();
        }

        function getDragAfterElement(container, clientX, clientY) {
            const draggableElements = [...container.querySelectorAll('.wo-chip:not(.dragging)')];
            return draggableElements.find(child => {
                const box = child.getBoundingClientRect();
                const childCenterY = box.top + box.height / 2;
                // 약간의 오차(30px) 허용
                if (clientY < childCenterY - 30) return true;
                if (Math.abs(clientY - childCenterY) <= 30) {
                    if (clientX < box.left + box.width / 2) return true;
                }
                return false;
            });
        }

        function woToggleHint(btn) {
            const hintEl = document.getElementById('woHintLines');
            const visible = hintEl.style.display !== 'none';
            hintEl.style.display = visible ? 'none' : 'block';
            btn.textContent = visible ? '💡 힌트' : '💡 힌트 숨기기';
        }

        function woTtsAgain() {
            const verse = woList[woIdx % woList.length];
            ttsSpeak(verse.lines.join(' '));
        }

        function renderWoPool() {
            const pool = document.getElementById('woWordPool');
            pool.innerHTML = '';
            // pool drop zone
            pool.addEventListener('dragover', e => { 
                e.preventDefault(); 
                pool.classList.add('drag-over'); 
                if(!woDragChip) return;
                const afterElement = getDragAfterElement(pool, e.clientX, e.clientY);
                if (afterElement) pool.insertBefore(woDragChip, afterElement);
                else pool.appendChild(woDragChip);
            });
            pool.addEventListener('dragleave', () => pool.classList.remove('drag-over'));
            pool.addEventListener('drop', e => { 
                e.preventDefault(); 
                pool.classList.remove('drag-over'); 
                if(woDragChip) woDragChip.classList.remove('dragging'); 
            });
            woPool.forEach((word, i) => {
                pool.appendChild(makeWoChip(word, i, 'pool', -1));
            });
        }

        let activeTouchClone = null;
        let lastDropZone = null;

        function handleTouchStart(e) {
            if(e.touches.length > 1) return;
            const chip = e.target.closest('.wo-chip');
            if(!chip || chip.classList.contains('correct-chip')) return;
            e.preventDefault(); 
            
            woDragChip = chip;
            woDragFrom = chip.dataset.zone;
            woDragFromRow = Number(chip.dataset.rowIdx);
            
            chip.classList.add('dragging');
            
            const touch = e.touches[0];
            activeTouchClone = chip.cloneNode(true);
            activeTouchClone.style.position = 'fixed';
            activeTouchClone.style.left = touch.clientX + 'px';
            activeTouchClone.style.top = touch.clientY + 'px';
            activeTouchClone.style.transform = 'translate(-50%, -50%) scale(1.1)';
            activeTouchClone.style.opacity = '0.9';
            activeTouchClone.style.zIndex = '9999';
            activeTouchClone.style.pointerEvents = 'none'; 
            document.body.appendChild(activeTouchClone);
        }

        function handleTouchMove(e) {
            if(!activeTouchClone) return;
            e.preventDefault(); 
            const touch = e.touches[0];
            activeTouchClone.style.left = touch.clientX + 'px';
            activeTouchClone.style.top = touch.clientY + 'px';
            
            const el = document.elementFromPoint(touch.clientX, touch.clientY);
            const dropZoneRow = el ? el.closest('.wo-answer-row') : null;
            const dropZonePool = el ? el.closest('.wo-word-pool') : null;
            const currentDropZone = dropZoneRow || dropZonePool;
            
            if(lastDropZone && lastDropZone !== currentDropZone) {
                lastDropZone.classList.remove('drag-over');
            }
            if(currentDropZone) {
                currentDropZone.classList.add('drag-over');
                if(woDragChip) {
                    const afterElement = getDragAfterElement(currentDropZone, touch.clientX, touch.clientY);
                    if (afterElement) currentDropZone.insertBefore(woDragChip, afterElement);
                    else currentDropZone.appendChild(woDragChip);
                }
            }
            lastDropZone = currentDropZone;
        }

        function handleTouchEnd(e) {
            if(!activeTouchClone) return;
            
            if(lastDropZone) {
                lastDropZone.classList.remove('drag-over');
                lastDropZone = null;
            }
            
            if(woDragChip) woDragChip.classList.remove('dragging');
            if(activeTouchClone) activeTouchClone.remove();
            activeTouchClone = null;
            woDragChip = null;
            document.getElementById('woFeedback').textContent = '';
            woCheck(true);
        }

        function makeWoChip(word, idx, zone, rowIdx) {
            const chip = document.createElement('span');
            chip.className = `wo-chip ${zone==='pool' ? 'pool-chip' : 'ans-chip'}`;
            chip.textContent = word;
            chip.dataset.word = word;
            chip.dataset.zone = zone;
            chip.dataset.rowIdx = rowIdx;
            chip.draggable = true;
            chip.addEventListener('dragstart', e => {
                woDragChip = chip;
                woDragFrom = zone;
                woDragFromRow = Number(chip.dataset.rowIdx);
                setTimeout(()=>chip.classList.add('dragging'), 0);
                e.dataTransfer.effectAllowed = 'move';
            });
            chip.addEventListener('dragend', () => {
                chip.classList.remove('dragging');
                document.getElementById('woFeedback').textContent = '';
            });

            chip.addEventListener('touchstart', handleTouchStart, {passive: false});
            chip.addEventListener('touchmove', handleTouchMove, {passive: false});
            chip.addEventListener('touchend', handleTouchEnd);
            chip.addEventListener('touchcancel', handleTouchEnd);

            return chip;
        }

        function woCheck(isAuto = false) {
            const rows = document.querySelectorAll('.wo-answer-row');
            let allCorrect = true;
            let totalChips = 0;
            rows.forEach((row, rowIdx) => {
                const chips = [...row.querySelectorAll('.wo-chip')];
                totalChips += chips.length;
                const userWords = chips.map(c=>c.dataset.word);
                const lineCorrect = woLines[rowIdx];
                if(JSON.stringify(userWords) !== JSON.stringify(lineCorrect)) {
                    allCorrect = false;
                }
            });

            if (isAuto) {
                if (woLevel === 2) {
                    const poolChips = document.querySelectorAll('#woWordPool .wo-chip').length;
                    if (poolChips > 0 || !allCorrect) return; 
                } else {
                    if (!allCorrect) return; 
                }
            }

            rows.forEach((row, rowIdx) => {
                const chips = [...row.querySelectorAll('.wo-chip')];
                const lineCorrect = woLines[rowIdx];
                const rowOk = JSON.stringify(chips.map(c=>c.dataset.word)) === JSON.stringify(lineCorrect);
                if(rowOk) {
                    chips.forEach(c=>{ c.classList.add('correct-chip'); c.draggable=false; });
                } else if(!isAuto) {
                    allCorrect = false;
                    chips.forEach((c,i)=>{
                        if(c.dataset.word !== (lineCorrect[i]||'')) {
                            c.classList.add('wrong-chip');
                            setTimeout(()=>c.classList.remove('wrong-chip'), 700);
                        }
                    });
                }
            });

            if(allCorrect) {
                scheduleReview(woList[woIdx%woList.length].id, true);
                triggerSuccessEffect('woFeedback', () => ttsSpeak(woList[woIdx%woList.length].lines.join(' ')));
                document.getElementById('woTtsBtn').style.display = 'inline-block';
            } else if (!isAuto) {
                document.getElementById('woFeedback').textContent = '❌ 틀린 단어가 있어요. 다시 조정해 보세요!';
                scheduleReview(woList[woIdx%woList.length].id, false);
            }
        }

        function woReset() { renderWordOrder(); }
        function woNext() {
            woIdx++;
            if(woIdx >= woList.length) { alert('모든 구절 완료! 🎉'); closeWordOrder(); return; }
            renderWordOrder();
        }

        // ══════════════════════════════════════════
        // ⑤ TTS
        // ══════════════════════════════════════════
        function ttsSpeak(text) {
            if(!window.speechSynthesis) return;
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang='ko-KR'; u.rate=0.85;
            const btn = document.getElementById('ttsMainBtn');
            u.onstart = ()=>btn.classList.add('speaking');
            u.onend = u.onerror = ()=>btn.classList.remove('speaking');
            speechSynthesis.speak(u);
        }
        function ttsCurrentSlide() {
            const slides = document.querySelectorAll('.slide');
            const s = slides[currentSlide]; if(!s) return;
            const v = appData.find(x=>String(x.id)===String(s.dataset.verseId));
            if(v) ttsSpeak(v.ref+'. '+v.lines.join(' '));
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
